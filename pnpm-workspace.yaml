packages:
  - "apps/*"
  - "packages/*"
# pnpm 10+ moved `shamefully-hoist` (.npmrc) and `pnpm.onlyBuiltDependencies`
# (package.json) here. Both settings are still declared in their old spots
# above for pnpm 9, which CI pins (see .github/workflows/ci.yml) and which
# still reads them there. Keep all three in sync if the dependency list changes.
shamefullyHoist: true
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
patchedDependencies:
  "@agentclientprotocol/claude-agent-acp@0.91.0": patches/@agentclientprotocol__claude-agent-acp@0.91.0.patch
  "@agentclientprotocol/codex-acp@2.2.2": patches/@agentclientprotocol__codex-acp@2.2.2.patch
  "@radix-ui/react-dismissable-layer@1.1.11": patches/@radix-ui__react-dismissable-layer@1.1.11.patch
