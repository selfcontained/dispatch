id: unified-reviews-migration
title: Verify unified reviews migration
summary: >
  Migrates legacy persona review records into the unified reviews, feedback
  items, and thread messages model, then adds explicit review-agent roles and
  reviewer uniqueness protection. The database migrations run automatically
  on server boot, are idempotent, and retain the legacy source rows. Route this
  update through assisted update so the operator can allow for a longer first
  startup on installations with substantial legacy review history and confirm
  that the service returns healthy afterward.

alreadySatisfied:
  description: >
    Treat this migration as already satisfied only after verifying that the
    running service is healthy on the target tag and release.json reports that
    same target tag. Do not infer this from the target tarball being cached for
    manifest inspection: the assisted update normally launches before the
    managed update endpoint applies the target release. A healthy service on
    the target tag has completed migrations 0032 through 0034; rerunning them
    is safe and does not duplicate migrated reviews or feedback items.

instructions:
  - >
    During inspect, before invoking the managed update endpoint, read
    DATABASE_URL from the service directory's .env without modifying it and
    run this read-only query:
    SELECT a.name, pr.persona, pr.status FROM persona_reviews pr JOIN agents a
    ON a.id = pr.agent_id WHERE a.deleted_at IS NULL AND pr.status IN
    ('reviewing', 'awaiting_recheck') ORDER BY pr.updated_at DESC.
  - If any in-flight legacy reviews are found, report the update as blocked,
    list the reviewer agent name, persona, and status for the operator, and tell
    them to finish or cancel those reviews before retrying the update. Do not
    invoke the managed update endpoint while any such rows remain.
  - If the in-flight review guard is clear and the already-satisfied condition
    is false, continue through the framework's apply phase and invoke the
    managed update endpoint. Migrations 0032 through 0034 run automatically
    when the target service starts.
  - Allow extra startup time if the installation contains substantial legacy
    persona review history; migration 0032 copies those records once into the
    unified review model while retaining the legacy source rows.
  - Confirm $DISPATCH_API_URL/api/v1/health returns status=ok after startup.
  - Confirm release.json under the install directory reports the target tag.
  - If the healthy target state is already satisfied, do not modify review data
    manually; proceed straight to the validate phase.

validation:
  requiredChecks:
    - service_restarted
    - health_endpoint
    - version_converged

rollback:
  - If the target release does not return healthy, roll back to the previous
    release tag using the normal release rollback path for this host.
  - Leave the additive unified review tables, migrated rows, agent role values,
    and reviewer uniqueness index in place. The legacy review source rows are
    retained, and removing migrated data manually is less safe than leaving it
    for a later target release to reuse idempotently.
  - Restart the prior release and confirm $DISPATCH_API_URL/api/v1/health
    returns status=ok and release.json reports the prior tag.
