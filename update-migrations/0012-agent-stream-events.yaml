id: agent-stream-events
title: Verify agent_stream_events migration and Dispatch Harness agent restart
summary: >
  Adds the `agent_stream_events` table that stores the Chat-tab stream of
  the `dispatch` (Dispatch Harness) agent type: assistant messages, thoughts,
  tool calls, status rows, and plans folded from an Agent Client Protocol
  session, plus `agent_chat_messages.delivery_text` for a first turn that must
  carry more than its display text. Both changes are additive and guarded, and
  the migrations run automatically on server boot. The `dispatch` agent type
  runs four engines over the Agent Client Protocol: Claude Code, Codex, Gemini
  CLI, and OpenCode, each a host install using its own login. A running
  Dispatch Harness agent does not survive a service restart; the new process
  resumes it on its stored session id.

alreadySatisfied:
  description: >
    The install is already on the target tag, the local health endpoint
    returns status=ok, and release.json reports the target tag. Server boot
    runs both migrations idempotently and both changes are additive, so any
    healthy install at the target tag has already taken them. Running
    Dispatch Harness agents, if any existed, were resumed or marked errored
    at boot.

instructions:
  - Confirm the service has been restarted to the target release tag.
  - Confirm $DISPATCH_API_URL/api/v1/health returns status=ok.
  - Confirm release.json under the install directory reports the target tag.
  - Expect any Dispatch Harness agents that were running before the restart to
    show either "Harness session resumed." or an error naming the engine's
    login command; the latter means Start must be pressed again once the
    engine has completed that login.
  - Since alreadySatisfied is true on every healthy install at the target tag,
    do not perform any change steps, proceed straight to the validate phase.

validation:
  requiredChecks:
    - service_restarted
    - health_endpoint
    - version_converged

rollback:
  - >
    Roll back using the normal release rollback path for this host.
    The agent_stream_events table and the agent_chat_messages.delivery_text
    column are both additive: the prior release ignores them, and leaving
    them in place is harmless and safer than dropping them.
  - Restart the service and confirm $DISPATCH_API_URL/api/v1/health returns
    status=ok and release.json reports the prior tag.
