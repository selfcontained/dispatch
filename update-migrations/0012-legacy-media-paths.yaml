id: legacy-media-paths
title: Migrate shared media from the legacy literal-tilde directory
summary: >
  Earlier Dispatch versions accepted MEDIA_ROOT values such as
  ~/.dispatch/media without expanding the tilde. Those installs stored shared
  media beneath a literal `~` directory inside the Dispatch install. This
  migration moves that legacy tree to the location the fixed runtime reads, so
  historical dispatch_list_media entries remain readable after the
  path-resolution fix. Installs whose MEDIA_ROOT is an absolute path were
  never affected and this migration is a no-op for them.

alreadySatisfied:
  description: >
    Either the install's effective MEDIA_ROOT does not begin with `~` — in
    which case it never wrote to a literal-tilde path and nothing needs to
    happen — or the legacy directory derived from that MEDIA_ROOT is absent or
    empty, no active agent has a stored media_dir beginning with `~`, and the
    current service is healthy on the target tag. Do not read MEDIA_ROOT from
    <Dispatch install>/.env alone: the runtime loads that file through dotenv,
    which does not override a value already set in the service process
    environment (systemd Environment= including drop-ins and EnvironmentFile=,
    launchd EnvironmentVariables, docker -e). Run `bin/migrate-legacy-media
    --dry-run`, which asks systemd for the effective environment before falling
    back to .env and reports which root it resolved and from where.

instructions:
  - >
    First determine the install's effective MEDIA_ROOT. Run
    `bin/migrate-legacy-media --dry-run`: it resolves the root from the
    service's effective environment — asking systemd, so drop-ins and
    EnvironmentFile= are covered, or reading the launchd plist — before falling
    back to <Dispatch install>/.env, and reports which source it used. If a
    systemd service exists but cannot be interrogated it exits 1 rather than
    guessing.
    Do not classify from .env alone — dotenv does not override a value already
    present in the service process environment, so .env can disagree with what
    the service actually ran with. If the resolved root does not begin with
    `~`, this migration is an explicit no-op: report that the install was never
    affected, do NOT stop any agents, and continue with the rest of the update
    plan. Only tilde-configured installs need the steps below.
  - >
    If the command exits 1 asking for --media-root, it could not establish the
    effective media root: either a systemd service it cannot interrogate, or a
    literal-tilde tree the readable configuration does not explain — the
    service ran with an override this script cannot see. Determine the value that
    service actually used (its unit, plist, or container definition) and rerun
    with --media-root set to it. Do not treat this as a no-op.
  - >
    During inspect on a tilde-configured install, check whether the legacy
    directory <Dispatch install>/<literal MEDIA_ROOT value> exists and list
    every active agent. Running `bin/migrate-legacy-media --dry-run` is the
    supported way to resolve the media root and see the legacy tree's contents
    without moving anything.
  - If alreadySatisfied is false, use the managed update endpoint to install
    the target release and wait for the service to become healthy.
  - >
    After the target service is healthy, stop every active agent on this
    install cleanly. Stop them all rather than trying to identify which ones
    predate the fix: a still-running agent holds a literal-tilde
    DISPATCH_MEDIA_DIR in its retained environment and can recreate the legacy
    tree after the move, and there is no reliable way to inspect a live
    agent's launch-time environment. If an agent cannot be safely stopped,
    report the update as blocked and do not run the file migration.
  - From the Dispatch install directory, run
    bin/migrate-legacy-media --dry-run and inspect its summary before moving
    anything. Do not manually overwrite destination files. Exit status 1 means
    the scan itself was incomplete (for example an unreadable directory) —
    treat that as blocked and fix it before proceeding, because a partial scan
    can otherwise look like a clean result.
  - Run bin/migrate-legacy-media --apply only when the dry run reports zero
    conflicts and zero unsupported entries. The command is idempotent and
    retains conflicting source files for manual recovery.
  - If the command reports conflicts or unsupported entries, report the
    update as blocked with the affected relative paths; do not delete either
    copy. Otherwise confirm the legacy directory is absent or empty.
  - Restart each agent stopped for this migration only after the file migration
    succeeds (including when the migration is a no-op), so its
    DISPATCH_MEDIA_DIR is recreated from the corrected absolute path.
  - Confirm $DISPATCH_API_URL/api/v1/health returns status=ok and release.json
    under the install directory reports the target tag.

validation:
  requiredChecks:
    - service_restarted
    - health_endpoint
    - version_converged

rollback:
  - >
    Before bin/migrate-legacy-media --apply has run, rollback is unrestricted:
    no files have moved, so the previous release resolves media exactly as it
    did before. Roll back using the normal Dispatch rollback flow if the target
    service does not return healthy.
  - >
    After --apply has moved files, a plain rollback is NOT safe. The
    pre-fix runtime resolves `~` literally again, while the migrated files now
    exist only under the expanded home path — the service will pass its health
    check while every migrated media file reads as missing. Prefer staying on
    the fixed release and resolving the failure forward.
  - >
    If rolling back after a move is unavoidable, first move the migrated files
    back into the literal-tilde tree under the install directory before
    starting the old binary, so the pre-fix runtime finds them where it
    expects. Never delete either copy while doing so.
  - If media migration has started and files remain in both places, leave both
    the corrected destination files and any unresolved source files in place;
    the migration never overwrites destination data, so rerunning it is safe
    after recovery.
  - Restart the prior service and confirm its health endpoint returns status=ok.
