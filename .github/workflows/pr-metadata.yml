name: PR metadata

on:
  pull_request:
    branches: [main, acp-runtime]
    types: [opened, synchronize, reopened, edited]

# Independent lifecycle: metadata updates never cancel code validation here.
concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  metadata:
    name: PR metadata
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Re-evaluate current metadata in the same failed run on a manual retry.
      # Reruns otherwise retain the original event snapshot.
      # No checkout, PR code execution, custom check writes, or metadata logging.
      - name: No Claude Code session links in the PR title or description
        uses: actions/github-script@v8
        with:
          script: |
            const expected = context.payload.pull_request;
            const number = context.payload.number;
            if (!expected || !Number.isSafeInteger(number) || number <= 0) {
              throw new Error('Expected a pull request event');
            }
            const read = async () => {
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
              if (pr.state !== 'open' || pr.head.sha !== expected.head.sha ||
                  pr.base.ref !== expected.base.ref ||
                  pr.base.repo.full_name !== expected.base.repo.full_name ||
                  pr.head.repo?.full_name !== expected.head.repo?.full_name) {
                throw new Error('PR head, target, repository or state changed; use checks for the current head and target');
              }
              return { title: pr.title ?? '', body: pr.body ?? '' };
            };
            // History survives title edits, pushes, reopenings and manual retries.
            // Filter server-side, but follow cursors rather than assuming one page.
            const requireOriginalTarget = async () => {
              let cursor = null;
              const seen = new Set();
              while (true) {
                const data = await github.graphql(`query($owner:String!, $repo:String!, $number:Int!, $cursor:String) {
                  repository(owner:$owner,name:$repo) { pullRequest(number:$number) {
                    timelineItems(first:100,after:$cursor,itemTypes:[BASE_REF_CHANGED_EVENT,AUTOMATIC_BASE_CHANGE_SUCCEEDED_EVENT]) {
                      nodes { __typename }
                      pageInfo { hasNextPage endCursor }
                    }
                  } }
                }`, { ...context.repo, number, cursor });
                const page = data.repository.pullRequest.timelineItems;
                if (!Array.isArray(page.nodes) || !page.pageInfo ||
                    typeof page.pageInfo.hasNextPage !== 'boolean') {
                  throw new Error('PR retarget history unavailable; retry metadata validation');
                }
                if (page.nodes.length) {
                  throw new Error('This PR has changed its base branch. Open a replacement PR against the desired base so fresh code CI validates that target. Reopening, pushing or editing this PR cannot clear its retarget history.');
                }
                if (!page.pageInfo.hasNextPage) return;
                const next = page.pageInfo.endCursor;
                if (typeof next !== 'string' || !next || seen.has(next) || seen.size >= 100) {
                  throw new Error('Invalid or incomplete PR retarget history; retry metadata validation');
                }
                seen.add(next);
                cursor = next;
              }
            };
            const current = await read();
            await requireOriginalTarget();
            const verified = await read();
            if (current.title !== verified.title || current.body !== verified.body) {
              throw new Error('PR metadata changed during validation; retry the latest metadata run');
            }
            if (/claude\.ai\/code\/session/i.test(`${current.title}\n${current.body}`)) {
              core.setFailed('Remove the Claude Code session link from the PR title/description, then rerun this specific failed PR metadata run. A new edit alone may leave this failed suite required.');
            } else {
              core.info('Current PR metadata passes for the expected head and target.');
            }
