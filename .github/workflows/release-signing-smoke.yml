name: Release Signing Smoke

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: true
        default: "main"
        type: string

concurrency:
  group: dispatch-release-signing-smoke-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  verify-ref:
    runs-on:
      - self-hosted
      - Linux

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start Postgres
        id: postgres
        run: |
          CONTAINER="dispatch-signing-smoke-verify-pg-$GITHUB_RUN_ID"
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          PORT=$((RANDOM % 10000 + 10000))
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          docker run --rm -d \
            --name "$CONTAINER" \
            -e POSTGRES_USER=dispatch \
            -e POSTGRES_PASSWORD=dispatch \
            -e POSTGRES_DB=postgres \
            -p "$PORT":5432 \
            postgres:17-alpine
          for i in $(seq 1 15); do
            docker exec "$CONTAINER" pg_isready -U dispatch && break
            sleep 1
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Lint
        run: pnpm run lint:web

      - name: Test
        run: pnpm run test
        env:
          TEST_DATABASE_URL: postgres://dispatch:dispatch@127.0.0.1:${{ steps.postgres.outputs.port }}/postgres

      - name: Stop Postgres
        if: always()
        run: docker stop ${{ steps.postgres.outputs.container }} 2>/dev/null || true

  build-signed-binaries:
    needs: verify-ref
    runs-on:
      - self-hosted
      - macOS

    permissions:
      contents: read

    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Derive artifact name
        id: meta
        run: |
          REF_SLUG=$(printf '%s' '${{ inputs.ref }}' | tr '/:' '--')
          echo "artifact_name=release-signing-smoke-${REF_SLUG}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db
          security default-keychain -d user -s build.keychain

      - name: Import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CERT_BASE64" | openssl base64 -d -A -out "$CERT_PATH"
          security import "$CERT_PATH" \
            -k build.keychain \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcrun
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$CERT_PASSWORD" \
            build.keychain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed Bun binaries
        run: pnpm run build:bun
        env:
          DISPATCH_CODESIGN_IDENTITY: "Developer ID Application: Brad Harris (ML8BQ6D727)"
          DISPATCH_MACOS_BUNDLE_ID: dev.bradharris.dispatch
          DISPATCH_NOTARIZE_MACOS_BINARIES: "1"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Pack smoke artifact
        run: bin/pack-release --output dispatch-release.tar.gz

      - name: Upload smoke bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          if-no-files-found: error
          path: |
            dist/bun/
            dispatch-release.tar.gz
            release-notes/current.md
          retention-days: 7

      - name: Delete temporary keychain
        if: always()
        run: security delete-keychain build.keychain || true

  smoke-linux:
    needs: build-signed-binaries
    runs-on:
      - self-hosted
      - Linux

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download smoke bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-signed-binaries.outputs.artifact_name }}

      - name: Restore binary execute bits
        run: chmod +x dist/bun/dispatch-*

      - name: Start Postgres
        id: postgres
        run: |
          CONTAINER="dispatch-signing-smoke-linux-pg-$GITHUB_RUN_ID"
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          PORT=$((RANDOM % 10000 + 10000))
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          docker run --rm -d \
            --name "$CONTAINER" \
            -e POSTGRES_USER=dispatch \
            -e POSTGRES_PASSWORD=dispatch \
            -e POSTGRES_DB=postgres \
            -p "$PORT":5432 \
            postgres:17-alpine
          for i in $(seq 1 15); do
            docker exec "$CONTAINER" pg_isready -U dispatch && break
            sleep 1
          done

      - name: Smoke test Linux binary
        run: |
          case "$(uname -m)" in
            aarch64|arm64) ARCH="arm64" ;;
            x86_64) ARCH="x64" ;;
            *) echo "unsupported Linux architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          BINARY=$(find dist/bun -maxdepth 1 -type f -name "dispatch-*-bun-linux-${ARCH}" | head -n 1)
          if [[ -z "$BINARY" ]]; then
            echo "error: no Linux Bun binary found for architecture ${ARCH}" >&2
            exit 1
          fi
          bun scripts/smoke-bun-binary.mjs "$BINARY"
        env:
          TEST_DATABASE_URL: postgres://dispatch:dispatch@127.0.0.1:${{ steps.postgres.outputs.port }}/postgres

      - name: Stop Postgres
        if: always()
        run: docker stop ${{ steps.postgres.outputs.container }} 2>/dev/null || true

  smoke-macos:
    needs: build-signed-binaries
    runs-on:
      - self-hosted
      - macOS

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download smoke bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-signed-binaries.outputs.artifact_name }}

      - name: Restore binary execute bits
        run: chmod +x dist/bun/dispatch-*

      - name: Start Postgres
        id: postgres
        run: |
          CONTAINER="dispatch-signing-smoke-macos-pg-$GITHUB_RUN_ID"
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          PORT=$((RANDOM % 10000 + 10000))
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          docker run --rm -d \
            --name "$CONTAINER" \
            -e POSTGRES_USER=dispatch \
            -e POSTGRES_PASSWORD=dispatch \
            -e POSTGRES_DB=postgres \
            -p "$PORT":5432 \
            postgres:17-alpine
          for i in $(seq 1 15); do
            docker exec "$CONTAINER" pg_isready -U dispatch && break
            sleep 1
          done

      - name: Smoke test macOS binary
        run: |
          case "$(uname -m)" in
            arm64|aarch64) ARCH="arm64" ;;
            x86_64) ARCH="x64" ;;
            *) echo "unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          BINARY=$(find dist/bun -maxdepth 1 -type f -name "dispatch-*-bun-darwin-${ARCH}" | head -n 1)
          if [[ -z "$BINARY" ]]; then
            echo "error: no macOS Bun binary found for architecture ${ARCH}" >&2
            exit 1
          fi
          bun scripts/smoke-bun-binary.mjs "$BINARY"
          codesign -dvv "$BINARY"
          spctl -a -vv -t install "$BINARY"
        env:
          TEST_DATABASE_URL: postgres://dispatch:dispatch@127.0.0.1:${{ steps.postgres.outputs.port }}/postgres

      - name: Stop Postgres
        if: always()
        run: docker stop ${{ steps.postgres.outputs.container }} 2>/dev/null || true
