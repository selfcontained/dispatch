name: macOS Sparkle Service Proof

# Test-only artifacts, never a release. One hosted build at a time.
on:
  push:
    branches: [agt_e49fa225fda7/agent-25fda7]
    paths:
      - .github/workflows/macos-sparkle-proof.yml
      - scripts/build-macos-sparkle-proof.py
      - scripts/validate-macos-sparkle-proof.py
      - scripts/sparkle_proof_cleanup.py
      - scripts/test_sparkle_proof_cleanup.py
      - apps/macos/Sources/DispatchCore/ServiceControl.swift
      - apps/macos/Sources/DispatchCore/LocalDatabase.swift
      - apps/macos/Sources/DispatchMenu/SparkleProbe.swift
      - apps/macos/Sources/DispatchMenu/ServiceRegistration.swift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-sparkle-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Test proof driver failure handling
        run: python3 scripts/test_sparkle_proof_cleanup.py
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: dist/cache/postgres
          key: macos-postgres-${{ hashFiles('scripts/download-macos-postgres.mjs') }}
      - name: Download and verify Sparkle SDK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sparkle-sdk"
          curl --fail --location --silent --show-error \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz \
            -o "$RUNNER_TEMP/sparkle-sdk/sdk.tar.xz"
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $RUNNER_TEMP/sparkle-sdk/sdk.tar.xz" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/sparkle-sdk/sdk.tar.xz" -C "$RUNNER_TEMP/sparkle-sdk"
      - name: Build bundled server
        run: pnpm run build:bun
        env:
          DISPATCH_BUN_TARGETS: bun-darwin-arm64
          NODE_OPTIONS: --max-old-space-size=2048
      - name: Configure signing and notarization
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/dispatch-preview.keychain-db"
          CERT_PATH="$RUNNER_TEMP/dispatch-preview.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          printf '%s' "$CERT_BASE64" | openssl base64 -d -A -out "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          xcrun notarytool store-credentials dispatch-preview-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" --keychain "$KEYCHAIN_PATH"
          echo "DISPATCH_NOTARY_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Assemble signed base app
        run: pnpm run build:macos
        env:
          DISPATCH_MAC_ARCH: arm64
          DISPATCH_CODESIGN_IDENTITY: "Developer ID Application: Brad Harris (ML8BQ6D727)"
          DISPATCH_MAC_BUILD: ${{ github.run_number }}
      - name: Produce two notarized Sparkle service builds
        run: |
          python3 scripts/build-macos-sparkle-proof.py \
            --base-app 'dist/macos/arm64/Dispatch.app' \
            --sdk "$RUNNER_TEMP/sparkle-sdk" \
            --output dist/sparkle-proof \
            --proof-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --identity 'Developer ID Application: Brad Harris (ML8BQ6D727)' \
            --notary-profile dispatch-preview-notary \
            --notary-keychain "$DISPATCH_NOTARY_KEYCHAIN"
      - uses: actions/upload-artifact@v4
        with:
          name: dispatch-sparkle-service-proof
          path: dist/sparkle-proof/
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/dispatch-preview.p12"
          if [ -f "$RUNNER_TEMP/dispatch-preview.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/dispatch-preview.keychain-db"
          fi
