name: CI

on:
  pull_request:
    branches: [main, acp-runtime]
    # Metadata edits are validated independently, without restarting code CI.
    # After retargeting, close/reopen or push a commit for fresh code evidence.
    types: [opened, synchronize, reopened]

# Only a new code-validation event supersedes an existing code run.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # `ci` is the required status check. It stays one job and gates steps
  # rather than jobs: a skipped job reports success to branch protection,
  # whereas a step that is skipped here still leaves `ci` as the one result.
  ci:
    runs-on: self-hosted

    steps:
      # PR metadata is independently required and checks current title/body.
      # Keep the code job's required identity static on every subscribed event.
      - uses: actions/checkout@v6
        with:
          # ci.yml doesn't call gh/git push/private-registry work (that's release.yml).
          # Skipping credential persist means checkout's post-run also skips the
          # `git submodule foreach --recursive` cleanup loop, which is unnecessary
          # with no submodules and slow on self-hosted macOS.
          persist-credentials: false
          # Full history supplies the pinned base/head and their merge base.
          # The classifier still examines the checked-out PR merge commit.
          fetch-depth: 0

      # pnpm setup needs npm. Install Node first so self-hosted runners do not
      # fall back to the runner's bundled, incomplete npm launcher.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Capture the actual integration tree before executing PR code. The
      # event base SHA can lag the merge ref; its parents are authoritative.
      - name: Record integration context
        env:
          CI_CONTEXT: ${{ toJSON(github.event.pull_request) }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const pr = JSON.parse(process.env.CI_CONTEXT);
          const [merge, base, head, ...extra] = execFileSync('git', ['rev-list', '--parents', '-n', '1', 'HEAD'], { encoding: 'utf8' }).trim().split(/\s+/);
          if (extra.length || !base || head !== pr.head.sha) throw new Error('Expected the PR integration merge with the pinned head');
          writeFileSync(`${process.env.RUNNER_TEMP}/ci-context.json`, JSON.stringify({
            version: 1, number: pr.number, head, base, merge, eventUpdatedAt: pr.updated_at,
            target: pr.base.ref, repository: pr.base.repo.full_name,
            headRepository: pr.head.repo.full_name,
            run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT
          }));
          JS

      - name: Upload integration context before validation
        uses: actions/upload-artifact@v7
        with:
          name: ci-context-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-context.json
          if-no-files-found: error
          retention-days: 30

      # `docs` only when every change is an edit or addition to allowlisted
      # prose (see scripts/ci-change-scope.mjs); anything else, including a
      # classification error, is `full`. Later steps run unless scope is
      # exactly `docs`, so a missing output also means the full suite.
      - name: Classify changes
        id: scope
        run: node scripts/ci-change-scope.mjs
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Test change classifier
        run: node --test scripts/ci-change-scope.test.mjs

      - name: Test owned command cleanup
        run: node --test scripts/run-owned.test.mjs

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Start Postgres
        if: steps.scope.outputs.scope != 'docs'
        id: postgres
        run: |
          CONTAINER="dispatch-ci-$GITHUB_RUN_ID"
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          PORT=$((RANDOM % 10000 + 10000))
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          docker run --rm -d \
            --name "$CONTAINER" \
            -e POSTGRES_USER=dispatch \
            -e POSTGRES_PASSWORD=dispatch \
            -e POSTGRES_DB=postgres \
            -p "$PORT":5432 \
            postgres:17-alpine
          for i in $(seq 1 15); do
            docker exec "$CONTAINER" pg_isready -U dispatch && break
            sleep 1
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test CI event policy
        run: node --test scripts/ci-event-policy.test.mjs

      # This guard runs for every PR, including the docs fast path. It reads
      # ownership definitions from the PR head, not the merge checkout.
      - name: Require explicit PR owner coverage
        run: bun scripts/ci-owner-coverage.ts
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Install Playwright browsers
        if: steps.scope.outputs.scope != 'docs'
        run: pnpm exec playwright install chromium

      # The docs fast path's validation: the same Prettier check the full
      # suite starts with.
      - name: Check formatting (docs-only change)
        if: steps.scope.outputs.scope == 'docs'
        run: pnpm run format

      - name: Test macOS appcast publisher
        if: steps.scope.outputs.scope != 'docs'
        run: python3 scripts/test_macos_appcast.py

      - name: CI checks
        if: steps.scope.outputs.scope != 'docs'
        run: node scripts/run-owned.mjs pnpm run ci
        env:
          E2E_SKIP_WEB_BUILD: "1"
          DISPATCH_TEST_POSTGRES_CONTAINER: ${{ steps.postgres.outputs.container }}
          TEST_DATABASE_URL: postgres://dispatch:dispatch@127.0.0.1:${{ steps.postgres.outputs.port }}/postgres

      - name: Build Bun binaries
        if: steps.scope.outputs.scope != 'docs'
        run: node scripts/run-owned.mjs pnpm run build:bun

      - name: Smoke test compiled binary for host platform
        if: steps.scope.outputs.scope != 'docs'
        run: |
          case "$(uname -s)" in
            Darwin) PLATFORM="darwin" ;;
            Linux) PLATFORM="linux" ;;
            *) echo "unsupported platform: $(uname -s)" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            aarch64|arm64) ARCH="arm64" ;;
            x86_64) ARCH="x64" ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          BINARY=$(find dist/bun -maxdepth 1 -type f -name "dispatch-*-bun-${PLATFORM}-${ARCH}" | head -n 1)
          if [[ -z "$BINARY" ]]; then
            echo "error: no Bun binary found for platform ${PLATFORM}/${ARCH}" >&2
            exit 1
          fi
          bun scripts/smoke-bun-binary.mjs "$BINARY"
        env:
          TEST_DATABASE_URL: postgres://dispatch:dispatch@127.0.0.1:${{ steps.postgres.outputs.port }}/postgres

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always() && steps.scope.outputs.scope != 'docs'
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      - name: Stop Postgres
        if: always()
        run: docker stop ${{ steps.postgres.outputs.container }} 2>/dev/null || true
