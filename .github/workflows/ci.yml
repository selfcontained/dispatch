name: CI

on:
  pull_request:
    branches: [main, acp-runtime]
    # Base retargets still validate code; title/body-only edits only route.
    types: [opened, synchronize, reopened, edited]

# Metadata/routing edits cannot cancel code validation or overwrite its check.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title != null || github.event.changes.body != null) && 'routing' || 'code' }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title != null || github.event.changes.body != null) && 'CI routing' || 'ci' }}
    runs-on: ${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title != null || github.event.changes.body != null) && 'ubuntu-latest' || 'self-hosted' }}
    env:
      PR_METADATA_ONLY: ${{ github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title != null || github.event.changes.body != null) }}

    steps:
      # PR metadata is independently required from pr-metadata.yml. Keep the
      # metadata path named differently: a skipped `ci` could satisfy protection.
      - name: Route title or body edit
        if: env.PR_METADATA_ONLY == 'true'
        run: echo "Title/body-only edit; existing code validation remains authoritative."

      - uses: actions/checkout@v6
        if: env.PR_METADATA_ONLY != 'true'
        with:
          # ci.yml doesn't call gh/git push/private-registry work (that's release.yml).
          # Skipping credential persist means checkout's post-run also skips the
          # `git submodule foreach --recursive` cleanup loop, which is unnecessary
          # with no submodules and slow on self-hosted macOS.
          persist-credentials: false
          # Full history supplies the pinned base/head and their merge base.
          # The classifier still examines the checked-out PR merge commit.
          fetch-depth: 0

      # pnpm setup needs npm. Install Node first so self-hosted runners do not
      # fall back to the runner's bundled, incomplete npm launcher.
      - uses: actions/setup-node@v6
        if: env.PR_METADATA_ONLY != 'true'
        with:
          node-version: "22"

      # `docs` only when every change is an edit or addition to allowlisted
      # prose (see scripts/ci-change-scope.mjs); anything else, including a
      # classification error, is `full`. Later steps run unless scope is
      # exactly `docs`, so a missing output also means the full suite.
      - name: Classify changes
        if: env.PR_METADATA_ONLY != 'true'
        id: scope
        run: node scripts/ci-change-scope.mjs
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Test change classifier
        if: env.PR_METADATA_ONLY != 'true'
        run: node --test scripts/ci-change-scope.test.mjs

      - name: Test owned command cleanup
        if: env.PR_METADATA_ONLY != 'true'
        run: node --test scripts/run-owned.test.mjs

      - uses: pnpm/action-setup@v6
        if: env.PR_METADATA_ONLY != 'true'
        with:
          version: 9.15.9

      - uses: oven-sh/setup-bun@v2
        if: env.PR_METADATA_ONLY != 'true'
        with:
          bun-version: "1.3.13"

      - name: Start Postgres
        if: env.PR_METADATA_ONLY != 'true' && steps.scope.outputs.scope != 'docs'
        id: postgres
        run: |
          CONTAINER="dispatch-ci-$GITHUB_RUN_ID"
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          PORT=$((RANDOM % 10000 + 10000))
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          docker run --rm -d \
            --name "$CONTAINER" \
            -e POSTGRES_USER=dispatch \
            -e POSTGRES_PASSWORD=dispatch \
            -e POSTGRES_DB=postgres \
            -p "$PORT":5432 \
            postgres:17-alpine
          for i in $(seq 1 15); do
            docker exec "$CONTAINER" pg_isready -U dispatch && break
            sleep 1
          done

      - name: Install dependencies
        if: env.PR_METADATA_ONLY != 'true'
        run: pnpm install --frozen-lockfile

      - name: Test CI event policy
        if: env.PR_METADATA_ONLY != 'true'
        run: node --test scripts/ci-event-policy.test.mjs

      # This guard runs for every PR, including the docs fast path. It reads
      # ownership definitions from the PR head, not the merge checkout.
      - name: Require explicit PR owner coverage
        if: env.PR_METADATA_ONLY != 'true'
        run: bun scripts/ci-owner-coverage.ts
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Install Playwright browsers
        if: env.PR_METADATA_ONLY != 'true' && steps.scope.outputs.scope != 'docs'
        run: pnpm exec playwright install chromium

      # The docs fast path's validation: the same Prettier check the full
      # suite starts with.
      - name: Check formatting (docs-only change)
        if: env.PR_METADATA_ONLY != 'true' && steps.scope.outputs.scope == 'docs'
        run: pnpm run format

      - name: Test macOS appcast publisher
        if: env.PR_METADATA_ONLY != 'true' && steps.scope.outputs.scope != 'docs'
        run: python3 scripts/test_macos_appcast.py

      - name: CI checks
        if: env.PR_METADATA_ONLY != 'true' && steps.scope.outputs.scope != 'docs'
        run: node scripts/run-owned.mjs pnpm run ci
        env:
          E2E_SKIP_WEB_BUILD: "1"
          DISPATCH_TEST_POSTGRES_CONTAINER: ${{ steps.postgres.outputs.container }}
          TEST_DATABASE_URL: postgres://dispatch:dispatch@127.0.0.1:${{ steps.postgres.outputs.port }}/postgres

      - name: Build Bun binaries
        if: env.PR_METADATA_ONLY != 'true' && steps.scope.outputs.scope != 'docs'
        run: node scripts/run-owned.mjs pnpm run build:bun

      - name: Smoke test compiled binary for host platform
        if: env.PR_METADATA_ONLY != 'true' && steps.scope.outputs.scope != 'docs'
        run: |
          case "$(uname -s)" in
            Darwin) PLATFORM="darwin" ;;
            Linux) PLATFORM="linux" ;;
            *) echo "unsupported platform: $(uname -s)" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            aarch64|arm64) ARCH="arm64" ;;
            x86_64) ARCH="x64" ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          BINARY=$(find dist/bun -maxdepth 1 -type f -name "dispatch-*-bun-${PLATFORM}-${ARCH}" | head -n 1)
          if [[ -z "$BINARY" ]]; then
            echo "error: no Bun binary found for platform ${PLATFORM}/${ARCH}" >&2
            exit 1
          fi
          bun scripts/smoke-bun-binary.mjs "$BINARY"
        env:
          TEST_DATABASE_URL: postgres://dispatch:dispatch@127.0.0.1:${{ steps.postgres.outputs.port }}/postgres

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always() && env.PR_METADATA_ONLY != 'true' && steps.scope.outputs.scope != 'docs'
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      - name: Stop Postgres
        if: always() && env.PR_METADATA_ONLY != 'true'
        run: docker stop ${{ steps.postgres.outputs.container }} 2>/dev/null || true
