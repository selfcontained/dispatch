name: Release

# One release, one tag, both platforms. Cutting a release (manual dispatch)
# bumps the version and tags the selected release branch; pushing a vX.Y.Z
# tag yourself does the same build. Every release publishes as a GitHub prerelease and enters the
# macOS appcast on the Sparkle "preview" channel. promote-release.yml moves a
# tested release to stable without rebuilding it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags: ["v*.*.*"]

concurrency:
  group: dispatch-release
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on:
      - self-hosted
      - Linux

    permissions:
      contents: write

    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      release_commit: ${{ steps.prepare.outputs.release_commit }}
      artifact_name: ${{ steps.prepare.outputs.artifact_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare release commit
        id: prepare
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_BRANCH="$GITHUB_REF_NAME"
            case "$RELEASE_BRANCH" in
              main|acp-runtime) ;;
              *)
                echo "error: releases must be dispatched from main or acp-runtime" >&2
                exit 1
                ;;
            esac
            git fetch origin "$RELEASE_BRANCH" --tags --prune
            git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"

            mkdir -p release-notes
            PREV_TAG=$(git tag --sort=-version:refname | head -n 1)
            NEW_VERSION=$(npm version ${{ inputs.version }} --no-git-tag-version)
            pnpm -r exec npm version ${{ inputs.version }} --no-git-tag-version

            pnpm --filter @dispatch/browser-extension sync:manifest-version

            if git ls-remote --exit-code --tags origin "refs/tags/${NEW_VERSION}" >/dev/null 2>&1; then
              echo "error: remote tag ${NEW_VERSION} already exists" >&2
              exit 1
            fi

            if [ -n "$PREV_TAG" ]; then
              gh api "repos/${{ github.repository }}/releases/generate-notes" \
                -X POST \
                -f tag_name="$NEW_VERSION" \
                -f target_commitish="$RELEASE_BRANCH" \
                -f previous_tag_name="$PREV_TAG" \
                --jq '.body' > release-notes/current.md
            else
              gh api "repos/${{ github.repository }}/releases/generate-notes" \
                -X POST \
                -f tag_name="$NEW_VERSION" \
                -f target_commitish="$RELEASE_BRANCH" \
                --jq '.body' > release-notes/current.md
            fi

            # Stage every version-bearing manifest the workspace bump touched.
            # `pnpm -r` walks all pnpm-workspace.yaml packages, so this list must
            # cover them too — a missed one is left unstaged and breaks the rebase.
            git add \
              package.json \
              apps/*/package.json \
              packages/*/package.json \
              apps/browser-extension/public/manifest.json \
              pnpm-lock.yaml \
              release-notes/current.md
            git commit -m "Release ${NEW_VERSION}"

            # `git pull --rebase` aborts on unstaged tracked changes. Catch that
            # here so the cause is obvious instead of a bare exit 128 from rebase.
            if ! git diff --quiet; then
              echo "error: tracked files were modified but never staged into the release commit:" >&2
              git diff --name-only >&2
              exit 1
            fi

            git pull --rebase origin "$RELEASE_BRANCH"
            git push origin "HEAD:$RELEASE_BRANCH"

            TAG="$NEW_VERSION"
            git tag -a "$TAG" -m "Dispatch $TAG"
            # Push the tag as GITHUB_TOKEN, clearing checkout's RELEASE_PAT
            # header: a GITHUB_TOKEN push starts no workflow, so this run
            # builds the tag instead of a second, tag-triggered run.
            git -c http.https://github.com/.extraheader= push \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
              "refs/tags/${TAG}"
          else
            TAG="$GITHUB_REF_NAME"
            git checkout --detach "$GITHUB_SHA"
            git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --prune
            if ! git merge-base --is-ancestor HEAD origin/main &&
               ! git merge-base --is-ancestor HEAD origin/acp-runtime; then
              echo "error: $TAG must point at a commit on main or acp-runtime" >&2
              exit 1
            fi
            # Binaries are named from package.json; the installer and update
            # flow look them up by tag.
            PACKAGE_VERSION="v$(node -p 'require("./package.json").version')"
            if [ "$PACKAGE_VERSION" != "$TAG" ]; then
              echo "error: $TAG does not match package.json version $PACKAGE_VERSION" >&2
              exit 1
            fi
          fi

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "error: release $TAG already exists" >&2
            exit 1
          fi

          {
            echo "tag=${TAG}"
            echo "release_commit=$(git rev-parse HEAD)"
            echo "artifact_name=release-bundle-${TAG}"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-release:
    needs: prepare-release
    runs-on:
      - self-hosted
      - Linux

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_commit }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Start Postgres
        id: postgres
        run: |
          CONTAINER="dispatch-release-verify-pg-$GITHUB_RUN_ID"
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          PORT=$((RANDOM % 10000 + 10000))
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          docker run --rm -d \
            --name "$CONTAINER" \
            -e POSTGRES_USER=dispatch \
            -e POSTGRES_PASSWORD=dispatch \
            -e POSTGRES_DB=postgres \
            -p "$PORT":5432 \
            postgres:17-alpine
          for i in $(seq 1 15); do
            docker exec "$CONTAINER" pg_isready -U dispatch && break
            sleep 1
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Lint
        run: pnpm run lint:web

      - name: Test
        run: pnpm run test
        env:
          DISPATCH_TEST_POSTGRES_CONTAINER: ${{ steps.postgres.outputs.container }}
          TEST_DATABASE_URL: postgres://dispatch:dispatch@127.0.0.1:${{ steps.postgres.outputs.port }}/postgres

      - name: Stop Postgres
        if: always()
        run: docker stop ${{ steps.postgres.outputs.container }} 2>/dev/null || true

  build-binaries:
    needs:
      - prepare-release
      - verify-release
    runs-on:
      - self-hosted
      - macOS

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_commit }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db
          security default-keychain -d user -s build.keychain

      - name: Import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CERT_BASE64" | openssl base64 -d -A -out "$CERT_PATH"
          security import "$CERT_PATH" \
            -k build.keychain \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcrun
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$CERT_PASSWORD" \
            build.keychain

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$HOME/Library/Keychains/build.keychain-db"
          xcrun notarytool store-credentials dispatch-release-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Bun binaries
        run: |
          export DISPATCH_NOTARY_KEYCHAIN="$HOME/Library/Keychains/build.keychain-db"
          pnpm run build:bun
        env:
          DISPATCH_CODESIGN_IDENTITY: "Developer ID Application: Brad Harris (ML8BQ6D727)"
          DISPATCH_MACOS_BUNDLE_ID: dev.bradharris.dispatch
          DISPATCH_NOTARIZE_MACOS_BINARIES: "1"
          DISPATCH_NOTARY_KEYCHAIN_PROFILE: dispatch-release-notary

      - name: Pack release artifact
        run: bin/pack-release --output dispatch-server.tar.gz

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.prepare-release.outputs.artifact_name }}
          if-no-files-found: error
          path: |
            dist/bun/
            dispatch-server.tar.gz
            release-notes/current.md
          retention-days: 7

      - name: Delete temporary keychain
        if: always()
        run: security delete-keychain build.keychain || true

  build-macos-app:
    needs:
      - prepare-release
      - verify-release
    runs-on: macos-15
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      MAC_ARCH: arm64
      DISPATCH_SPARKLE_PUBLIC_KEY: ${{ vars.MACOS_SPARKLE_PUBLIC_KEY }}
      DISPATCH_SPARKLE_FEED_URL: https://dispatch.berad.dev/updates/macos/appcast-arm64.xml
      # The channel a fresh install follows until the person picks one.
      # Set the repository variable to "stable" once 1.0 is promoted.
      DISPATCH_DEFAULT_UPDATE_CHANNEL: ${{ vars.MACOS_DEFAULT_UPDATE_CHANNEL || 'preview' }}
      DISPATCH_MAC_BUILD: ${{ github.run_id }}.${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_commit }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Download verified Sparkle SDK
        run: |
          set -euo pipefail
          DISPATCH_SPARKLE_SDK="$RUNNER_TEMP/sparkle-sdk"
          echo "DISPATCH_SPARKLE_SDK=$DISPATCH_SPARKLE_SDK" >> "$GITHUB_ENV"
          mkdir -p "$DISPATCH_SPARKLE_SDK"
          curl --fail --location --silent --show-error https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz -o "$DISPATCH_SPARKLE_SDK/sdk.tar.xz"
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $DISPATCH_SPARKLE_SDK/sdk.tar.xz" | shasum -a 256 -c -
          tar -xf "$DISPATCH_SPARKLE_SDK/sdk.tar.xz" -C "$DISPATCH_SPARKLE_SDK"

      # Runs with the SDK present so the signed-feed tests also check the
      # official sign_update. Uses synthetic keys only.
      - name: Test appcast publisher
        run: python3 scripts/test_macos_appcast.py

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: dist/cache/postgres
          key: macos-postgres-${{ hashFiles('scripts/download-macos-postgres.mjs') }}

      - name: Extract verified PostgreSQL for Swift integration tests
        run: node scripts/download-macos-postgres.mjs "$MAC_ARCH" "$RUNNER_TEMP/dispatch-postgres-test"

      - run: swift test --package-path apps/macos --jobs 1
        env:
          DISPATCH_TEST_POSTGRES_BUNDLE: ${{ runner.temp }}/dispatch-postgres-test

      - run: pnpm run build:bun
        env:
          DISPATCH_BUN_TARGETS: bun-darwin-${{ env.MAC_ARCH }}
          NODE_OPTIONS: --max-old-space-size=2048

      - name: Configure signing and notarization
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/dispatch-macos.keychain-db"
          CERT_PATH="$RUNNER_TEMP/dispatch-macos.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          printf '%s' "$CERT_BASE64" | openssl base64 -d -A -out "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          xcrun notarytool store-credentials dispatch-macos-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" --keychain "$KEYCHAIN_PATH"
          echo "DISPATCH_NOTARY_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign, notarize, and verify app
        run: pnpm run build:macos
        env:
          DISPATCH_MAC_ARCH: ${{ env.MAC_ARCH }}
          DISPATCH_CODESIGN_IDENTITY: "Developer ID Application: Brad Harris (ML8BQ6D727)"
          DISPATCH_NOTARY_KEYCHAIN_PROFILE: dispatch-macos-notary
          DISPATCH_NOTARIZE_MACOS_APP: "1"

      - name: Smoke test relocated bundled PostgreSQL
        run: node scripts/smoke-macos-postgres.mjs "dist/macos/$MAC_ARCH/Dispatch.app/Contents/Helpers/Postgres"

      - name: Sign archive and describe it for the appcast
        env:
          MACOS_SPARKLE_PRIVATE_KEY: ${{ secrets.MACOS_SPARKLE_PRIVATE_KEY }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/sign-macos-archive.mjs "dist/macos/arm64/dispatch-macos-$DISPATCH_MAC_BUILD-arm64.zip" dist/macos/arm64/signature.txt
          python3 scripts/macos_appcast.py item --directory dist/macos/arm64 --build "$DISPATCH_MAC_BUILD" --version "${TAG#v}"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-app-${{ needs.prepare-release.outputs.tag }}
          path: |
            dist/macos/arm64/*.zip
            dist/macos/arm64/macos-item.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/dispatch-macos.p12"
          if [ -f "$RUNNER_TEMP/dispatch-macos.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/dispatch-macos.keychain-db"
          fi

  smoke-linux:
    needs:
      - prepare-release
      - build-binaries
    runs-on:
      - self-hosted
      - Linux

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_commit }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-release.outputs.artifact_name }}

      - name: Restore binary execute bits
        run: chmod +x dist/bun/dispatch-*

      - name: Start Postgres
        id: postgres
        run: |
          CONTAINER="dispatch-release-linux-pg-$GITHUB_RUN_ID"
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          PORT=$((RANDOM % 10000 + 10000))
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          docker run --rm -d \
            --name "$CONTAINER" \
            -e POSTGRES_USER=dispatch \
            -e POSTGRES_PASSWORD=dispatch \
            -e POSTGRES_DB=postgres \
            -p "$PORT":5432 \
            postgres:17-alpine
          for i in $(seq 1 15); do
            docker exec "$CONTAINER" pg_isready -U dispatch && break
            sleep 1
          done

      - name: Smoke test Linux binary
        run: |
          case "$(uname -m)" in
            aarch64|arm64) ARCH="arm64" ;;
            x86_64) ARCH="x64" ;;
            *) echo "unsupported Linux architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          BINARY=$(find dist/bun -maxdepth 1 -type f -name "dispatch-*-bun-linux-${ARCH}" | head -n 1)
          if [[ -z "$BINARY" ]]; then
            echo "error: no Linux Bun binary found for architecture ${ARCH}" >&2
            exit 1
          fi
          bun scripts/smoke-bun-binary.mjs "$BINARY"
        env:
          TEST_DATABASE_URL: postgres://dispatch:dispatch@127.0.0.1:${{ steps.postgres.outputs.port }}/postgres

      - name: Stop Postgres
        if: always()
        run: docker stop ${{ steps.postgres.outputs.container }} 2>/dev/null || true

  smoke-macos:
    needs:
      - prepare-release
      - build-binaries
    runs-on:
      - self-hosted
      - macOS

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_commit }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-release.outputs.artifact_name }}

      - name: Restore binary execute bits
        run: chmod +x dist/bun/dispatch-*

      - name: Start Postgres
        id: postgres
        run: |
          CONTAINER="dispatch-release-macos-pg-$GITHUB_RUN_ID"
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          PORT=$((RANDOM % 10000 + 10000))
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          docker run --rm -d \
            --name "$CONTAINER" \
            -e POSTGRES_USER=dispatch \
            -e POSTGRES_PASSWORD=dispatch \
            -e POSTGRES_DB=postgres \
            -p "$PORT":5432 \
            postgres:17-alpine
          for i in $(seq 1 15); do
            docker exec "$CONTAINER" pg_isready -U dispatch && break
            sleep 1
          done

      - name: Smoke test macOS binary
        run: |
          case "$(uname -m)" in
            arm64|aarch64) ARCH="arm64" ;;
            x86_64) ARCH="x64" ;;
            *) echo "unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          BINARY=$(find dist/bun -maxdepth 1 -type f -name "dispatch-*-bun-darwin-${ARCH}" | head -n 1)
          if [[ -z "$BINARY" ]]; then
            echo "error: no macOS Bun binary found for architecture ${ARCH}" >&2
            exit 1
          fi
          bun scripts/smoke-bun-binary.mjs "$BINARY"
          codesign -dvv "$BINARY"
          spctl -a -vv -t install "$BINARY"
        env:
          TEST_DATABASE_URL: postgres://dispatch:dispatch@127.0.0.1:${{ steps.postgres.outputs.port }}/postgres

      - name: Stop Postgres
        if: always()
        run: docker stop ${{ steps.postgres.outputs.container }} 2>/dev/null || true

  publish-release:
    needs:
      - prepare-release
      - build-binaries
      - build-macos-app
      - smoke-linux
      - smoke-macos
    runs-on:
      - self-hosted
      - Linux

    permissions:
      contents: write

    steps:
      # Self-hosted workspaces persist between runs; only this run's
      # artifacts may be attached.
      - name: Clear workspace
        run: rm -rf -- * .[!.]* 2>/dev/null || true

      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-release.outputs.artifact_name }}

      - name: Download macOS app
        uses: actions/download-artifact@v8
        with:
          name: macos-app-${{ needs.prepare-release.outputs.tag }}
          path: macos

      - name: Create GitHub prerelease from tested artifacts
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare-release.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "error: release $TAG already exists" >&2
            exit 1
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes/current.md \
            --prerelease \
            dispatch-server.tar.gz \
            macos/dispatch-macos-*-arm64.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-macos-appcast:
    needs:
      - prepare-release
      - publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_commit }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - run: pnpm install --frozen-lockfile

      - name: Download macOS app
        uses: actions/download-artifact@v8
        with:
          name: macos-app-${{ needs.prepare-release.outputs.tag }}
          path: ${{ runner.temp }}/macos

      # The feed is signed here, before deploy; the key stays in the environment.
      - name: Add the build to the preview channel
        run: python3 scripts/macos_appcast.py publish --item "$RUNNER_TEMP/macos/macos-item.json"
        env:
          MACOS_SPARKLE_PRIVATE_KEY: ${{ secrets.MACOS_SPARKLE_PRIVATE_KEY }}
          DISPATCH_SPARKLE_PUBLIC_KEY: ${{ vars.MACOS_SPARKLE_PUBLIC_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
