name: Promote Release

# Moves a tested release from preview to stable on both platforms, without
# rebuilding: the macOS appcast entry loses its Sparkle "preview" channel tag
# and the GitHub release stops being a prerelease (what Linux installs and
# the standalone updater follow). Rerunning is safe.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to promote (vX.Y.Z)"
        required: true
        type: string

concurrency:
  group: dispatch-release
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Check the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[1-9][0-9]*\.[0-9]+\.[0-9]+$'; then
            echo "error: tag must be vX.Y.Z with X >= 1" >&2
            exit 1
          fi
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' > assets.txt
          grep -qx 'dispatch-server.tar.gz' assets.txt || { echo "error: $TAG has no Linux artifact" >&2; exit 1; }
          grep -Eq '^dispatch-macos-.+-arm64\.zip$' assets.txt || { echo "error: $TAG has no macOS app" >&2; exit 1; }

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - run: pnpm install --frozen-lockfile

      # Re-checks the released archive (length, Ed25519 signature, and the
      # recovery protocol in its Info.plist) against the entry, then re-signs
      # the whole feed before deploying it.
      - name: Promote the macOS appcast entry
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern 'dispatch-macos-*-arm64.zip' --dir "$RUNNER_TEMP/macos"
          python3 scripts/macos_appcast.py promote --version "${TAG#v}" --archives "$RUNNER_TEMP/macos"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          MACOS_SPARKLE_PRIVATE_KEY: ${{ secrets.MACOS_SPARKLE_PRIVATE_KEY }}
          DISPATCH_SPARKLE_PUBLIC_KEY: ${{ vars.MACOS_SPARKLE_PUBLIC_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Mark the GitHub release stable
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --prerelease=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
