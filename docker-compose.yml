services:
  postgres:
    image: postgres:17-alpine
    container_name: dispatch-postgres-${DISPATCH_DB_NAME:-dev}
    # The long-lived dev database should come back with Docker; the per-run
    # test databases must not, or a run killed before its teardown leaves a
    # container that Docker resurrects on every daemon start.
    restart: ${DISPATCH_DB_RESTART:-unless-stopped}
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
      POSTGRES_DB: dispatch_${DISPATCH_DB_NAME:-dev}
    ports:
      - "${DISPATCH_DB_PORT:-5433}:5432"
    volumes:
      # A named volume, so the data belongs to the stack rather than to the
      # container: `dispatch-dev down` can remove the container and give it
      # back on the next `up`, on whatever port is free then. Removed only
      # by `down --wipe` (and by the test harnesses, which always pass -v).
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U dispatch -d dispatch_${DISPATCH_DB_NAME:-dev}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
