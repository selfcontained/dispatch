services:
  postgres:
    image: postgres:17-alpine
    container_name: dispatch-postgres-${DISPATCH_DB_NAME:-dev}
    # The long-lived dev database should come back with Docker; the per-run
    # test databases must not, or a run killed before its teardown leaves a
    # container that Docker resurrects on every daemon start.
    restart: ${DISPATCH_DB_RESTART:-unless-stopped}
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
      POSTGRES_DB: dispatch_${DISPATCH_DB_NAME:-dev}
    ports:
      - "${DISPATCH_DB_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U dispatch -d dispatch_${DISPATCH_DB_NAME:-dev}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
